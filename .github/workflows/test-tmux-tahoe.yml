name: Test tmux on Tahoe ARM64
on:
  push:
    paths:
      - 'tmux-*-macos-arm64.tar.gz'
      - '.github/workflows/test-tmux-tahoe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and run bundled tmux on Tahoe
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          test "$(uname -m)" = arm64
          shasum -a 256 -c tmux-3.8-macos-arm64.tar.gz.sha256
          mkdir "$RUNNER_TEMP/tmux relocated"
          tar -xzf tmux-3.8-macos-arm64.tar.gz -C "$RUNNER_TEMP/tmux relocated"
          bundle="$RUNNER_TEMP/tmux relocated/tmux-3.8-macos-arm64"
          for binary in "$bundle/libexec/tmux" "$bundle"/lib/*.dylib; do
            codesign --verify --strict "$binary"
            otool -L "$binary"
          done
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export TERM=xterm-256color
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH TERMINFO TERMINFO_DIRS
          tmux="$bundle/bin/tmux"
          test "$("$tmux" -V)" = 'tmux 3.8'
          socket="/tmp/tmux-tahoe-$$"
          trap '"$tmux" -S "$socket" kill-server || true' EXIT
          "$tmux" -S "$socket" -f /dev/null new-session -d -s validation /bin/sh
          "$tmux" -S "$socket" send-keys -t validation 'printf "TAHOE_OK\n"' Enter
          for attempt in {1..20}; do
            if "$tmux" -S "$socket" capture-pane -p -t validation | grep -qx TAHOE_OK; then
              echo 'PASS: tmux server and shell on Tahoe ARM64'
              exit 0
            fi
            sleep 0.25
          done
          exit 1
